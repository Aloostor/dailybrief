[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailybrief"
version = "0.1.0"
description = "DailyBrief CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34.2",
    "click>=8.1.7",
    "rich>=13.7.1",
]

[project.scripts]
dailybrief = "dailybrief.cli:main"

[tool.setuptools]
packages = ["dailybrief"]
